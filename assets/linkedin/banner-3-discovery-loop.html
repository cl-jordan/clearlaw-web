<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../og-src/fonts/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1584px; height: 396px; background: #f8f6f1; font-family: "DM Sans", sans-serif; color: #2c2a26;
         position: relative; overflow: hidden; }
  .rule { position: absolute; right: 0; top: 0; bottom: 0; width: 12px; background: #7a1f2b; }
  .content { position: absolute; left: 480px; right: 90px; top: 50%; transform: translateY(-50%); }
  .brand { display: flex; align-items: center; gap: 15px; margin-bottom: 22px; }
  .brand svg { width: 34px; height: 41px; }
  .brand .wm { font-family: "Source Serif 4", Georgia, serif; font-weight: 600; font-size: 30px; letter-spacing: -0.01em; }
  .brand .by { font-size: 17px; color: #6f675e; padding-top: 7px; }
  .brand .by b { color: #7a1f2b; font-weight: 600; }
  h1 { font-family: "Source Serif 4", Georgia, serif; font-size: 51px; line-height: 1.14; letter-spacing: -0.015em; font-weight: 600; max-width: 22ch; }
  h1 .gold { color: #9a6b00; }
  .url { margin-top: 20px; font-size: 20px; font-weight: 600; color: #7a1f2b; }
</style>
</head>
<body>
  <div class="rule"></div>
  <div class="content">
    <div class="brand">
      <svg viewBox="0 0 40 48"><path d="M7 13 L21 24 L7 35" fill="none" stroke="#7a1f2b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><line x1="22" y1="37.5" x2="34" y2="37.5" stroke="#7a1f2b" stroke-width="5" stroke-linecap="round"/></svg>
      <span class="wm">Discovery&nbsp;Loop</span>
      <span class="by">by <b>LitigationOS</b> · a Clearlaw product</span>
    </div>
    <h1>Your client&rsquo;s discovery answers — <span class="gold">without the three-week chase.</span></h1>
    <div class="url">clearlaw.ai/discovery-loop</div>
  </div>
